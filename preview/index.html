<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verso</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body class="min-h-screen">
    <header class="border-b border-border">
      <div class="mx-auto max-w-[1264px] px-6 sm:px-8">
        <div class="flex items-end justify-between gap-6 pt-7 pb-5">
          <p class="flex items-baseline gap-3">
            <span class="font-serif text-[2.5rem] leading-none tracking-[-0.02em]">Verso</span>
            <span class="type-overline text-muted-foreground">Beta</span>
          </p>
          <div class="flex items-center gap-6">
            <p class="hidden type-small text-muted-foreground md:block">A design system for reading. Set in Newsreader and Instrument Sans.</p>
            <button
              id="theme"
              type="button"
              aria-label="Switch between light and dark"
              class="inline-flex size-10 shrink-0 items-center justify-center rounded-sm border border-border text-foreground transition-colors hover:bg-accent"
            ></button>
          </div>
        </div>
        <hr class="verso-rule" />
        <div id="filters" class="-mb-px flex gap-6 overflow-x-auto" role="group" aria-label="Filter components"></div>
      </div>
    </header>

    <div id="sheet" class="mx-auto max-w-[1264px] px-6 pt-10 pb-6 sm:px-8">
      <main id="gallery" class="grid grid-cols-1 border-t border-l border-border sm:grid-cols-2 lg:grid-cols-3"></main>
    </div>

    <footer class="mx-auto flex max-w-[1264px] items-baseline justify-between gap-8 px-6 pb-10 sm:px-8">
      <p class="max-w-prose type-small text-muted-foreground">The texts are from The Commonplace, an invented weekly letter on cities, food and craft.</p>
      <p class="shrink-0 type-small text-muted-foreground">Verso 0.1.0</p>
    </footer>

    <script>
      const icon = (paths, size = 16) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      const icons = {
        copy: icon('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
        reset: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
        check: icon('<path d="M20 6 9 17l-5-5"/>'),
        moon: icon('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>', 18),
        sun: icon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>', 18),
        chevron: icon('<path d="m9 18 6-6-6-6"/>'),
        bookmark: icon('<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>', 20),
        share: icon('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>', 20),
        more: icon('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>', 20),
      };

      const button =
        'inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-sm px-5 type-ui transition-colors disabled:pointer-events-none disabled:opacity-40';
      const primary = `${button} bg-primary text-primary-foreground hover:bg-primary-hover`;
      const secondary = `${button} border border-input text-foreground hover:bg-accent`;
      const ghost = `${button} text-foreground hover:bg-accent`;
      const small =
        'inline-flex h-8 shrink-0 items-center justify-center gap-2 rounded-sm border border-input px-3.5 type-ui text-foreground transition-colors hover:bg-accent disabled:pointer-events-none disabled:opacity-40';
      const iconButton =
        'inline-flex size-10 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground';
      const chip =
        'inline-flex h-8 shrink-0 items-center rounded-sm border border-border px-3 type-ui text-muted-foreground transition-colors hover:border-input hover:text-foreground aria-pressed:border-primary aria-pressed:text-primary';
      const tab =
        'h-11 shrink-0 border-b-2 border-transparent type-ui text-muted-foreground transition-colors hover:text-foreground aria-selected:border-primary aria-selected:text-foreground';
      const field =
        'h-11 w-full rounded-sm border border-input bg-card px-3.5 font-sans text-base text-foreground placeholder:text-muted-foreground disabled:opacity-40';
      const option = 'flex items-center gap-3 type-small';
      const badge = 'inline-flex h-6 items-center gap-2 rounded-sm bg-secondary px-2 type-caption text-secondary-foreground';
      const tag =
        'inline-flex h-6 items-center rounded-sm border border-border px-2 type-overline text-muted-foreground transition-colors hover:border-input hover:text-foreground';
      const row = 'flex items-center justify-between gap-4 py-3.5';
      const toc = 'flex items-baseline gap-2 py-2.5 type-body transition-colors hover:text-primary';

      const components = [
        {
          name: 'Article header',
          category: 'Article',
          html: `<header class="w-full"><p class="type-overline text-primary">Cities · Issue 48</p><h1 class="mt-3 type-h1">The last ice seller of Pasar Baru</h1><p class="mt-4 type-standfirst text-muted-foreground">Every morning since 1973 a hand cart on Jalan Pintu Air has sold block ice. Its owner measures the day by how far the ice has sunk.</p><p class="mt-6 border-t border-border pt-4 type-small text-muted-foreground"><span class="text-foreground">Nadia Prameswari</span> · 12 October 2026 · <span class="whitespace-nowrap">9 min read</span></p></header>`,
        },
        {
          name: 'Drop cap',
          category: 'Article',
          html: `<p class="w-full type-body verso-dropcap">There is a hand cart on Jalan Pintu Air that has sold block ice every morning since 1973. Pak Hasan, its owner, measures the day by how far the ice has sunk below the rim of the tub.</p>`,
        },
        {
          name: 'Button',
          category: 'Input',
          html: `<div class="flex flex-col items-start gap-4"><div class="flex flex-wrap gap-3"><button type="button" class="${primary}">Subscribe</button><button type="button" class="${secondary}">Read later</button></div><div class="flex flex-wrap gap-3"><button type="button" class="${ghost}">Share</button><button type="button" class="${small}">Copy link</button></div></div>`,
        },
        {
          name: 'Toggle',
          category: 'Input',
          stateful: true,
          html: `<div class="w-full divide-y divide-border"><label class="flex items-center justify-between gap-6 py-3"><span class="type-body">Night reading</span><button type="button" role="switch" aria-checked="true" class="verso-switch"></button></label><label class="flex items-center justify-between gap-6 py-3"><span class="type-body">Show reading time</span><button type="button" role="switch" aria-checked="false" class="verso-switch"></button></label></div>`,
        },
        {
          name: 'Pull quote',
          category: 'Article',
          html: `<figure class="w-full border-y border-border py-6"><blockquote class="font-serif text-[1.75rem]/9 font-light italic">“A city is remembered by its smells before its streets.”</blockquote><figcaption class="mt-4 type-small text-muted-foreground">Nadia Prameswari</figcaption></figure>`,
        },
        {
          name: 'Subscribe form',
          category: 'Input',
          stateful: true,
          html: `<form class="w-full" data-subscribe><p class="type-title">One essay, every Sunday morning.</p><div class="mt-4 flex gap-2"><input type="email" required aria-label="Email" placeholder="you@example.com" class="h-11 min-w-0 flex-1 rounded-sm border border-input bg-card px-3.5 font-sans text-base text-foreground placeholder:text-muted-foreground" /><button type="submit" class="${primary}">Subscribe</button></div><p class="mt-3 type-small text-muted-foreground">Sent on Sundays. Unsubscribe in one click.</p></form>`,
        },
        {
          name: 'Text field',
          category: 'Input',
          stateful: true,
          html: `<label class="block w-full"><span class="type-ui">Display name</span><input type="text" value="Nadia Prameswari" class="mt-2 ${field}" /><span class="mt-2 block type-small text-muted-foreground">Shown with your comments.</span></label>`,
        },
        {
          name: 'Chip',
          category: 'Input',
          stateful: true,
          html: `<div role="group" aria-label="Topics" class="flex flex-wrap gap-2"><button type="button" aria-pressed="true" class="${chip}">Cities</button><button type="button" aria-pressed="false" class="${chip}">Food</button><button type="button" aria-pressed="false" class="${chip}">Craft</button><button type="button" aria-pressed="false" class="${chip}">Letters</button></div>`,
        },
        {
          name: 'Tabs',
          category: 'Navigation',
          stateful: true,
          html: `<div role="tablist" aria-label="Section" class="flex w-full gap-6 border-b border-border"><button type="button" role="tab" aria-selected="true" class="-mb-px ${tab}">Latest</button><button type="button" role="tab" aria-selected="false" tabindex="-1" class="-mb-px ${tab}">Essays</button><button type="button" role="tab" aria-selected="false" tabindex="-1" class="-mb-px ${tab}">Letters</button><button type="button" role="tab" aria-selected="false" tabindex="-1" class="-mb-px ${tab}">Archive</button></div>`,
        },
        {
          name: 'Slider',
          category: 'Input',
          stateful: true,
          html: `<div class="w-full"><div class="flex items-baseline justify-between gap-4"><span class="type-ui">Text size</span><output data-output class="type-small text-muted-foreground tabular-nums">19 px</output></div><input type="range" min="16" max="24" value="19" aria-label="Text size" class="mt-2 verso-slider" /></div>`,
        },
        {
          name: 'Single selection',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Line length</legend><div class="mt-3 space-y-3"><label class="${option}"><input type="radio" name="measure" value="narrow" class="verso-radio" />Narrow, 55 characters</label><label class="${option}"><input type="radio" name="measure" value="regular" checked class="verso-radio" />Regular, 66 characters</label><label class="${option}"><input type="radio" name="measure" value="wide" class="verso-radio" />Wide, 80 characters</label></div></fieldset>`,
        },
        {
          name: 'Checkbox',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Letters</legend><div class="mt-3 space-y-3"><label class="${option}"><input type="checkbox" checked class="verso-checkbox" />Sunday essay</label><label class="${option}"><input type="checkbox" class="verso-checkbox" />Midweek notes</label><label class="${option}"><input type="checkbox" class="verso-checkbox" />Event invitations</label></div></fieldset>`,
        },
        {
          name: 'Table of contents',
          category: 'Navigation',
          html: `<nav aria-label="In this issue" class="w-full"><p class="type-overline text-muted-foreground">In this issue</p><ol class="mt-3 divide-y divide-border border-y border-border"><li><a href="#" class="${toc}"><span>The ice seller</span><span aria-hidden="true" class="flex-1 border-b border-dotted border-input"></span><span class="type-small text-muted-foreground">4</span></a></li><li><a href="#" class="${toc}"><span>A grammar of alleyways</span><span aria-hidden="true" class="flex-1 border-b border-dotted border-input"></span><span class="type-small text-muted-foreground">12</span></a></li><li><a href="#" class="${toc}"><span>What a kiln remembers</span><span aria-hidden="true" class="flex-1 border-b border-dotted border-input"></span><span class="type-small text-muted-foreground">21</span></a></li><li><a href="#" class="${toc}"><span>Letters</span><span aria-hidden="true" class="flex-1 border-b border-dotted border-input"></span><span class="type-small text-muted-foreground">30</span></a></li></ol></nav>`,
        },
        {
          name: 'Reading progress',
          category: 'Navigation',
          html: `<div class="w-full border-b border-border"><div role="progressbar" aria-label="Reading progress" aria-valuenow="56" aria-valuemin="0" aria-valuemax="100" class="h-0.5 w-full bg-border"><div class="h-full w-[56%] bg-primary"></div></div><div class="flex h-11 items-center justify-between gap-4"><p class="truncate type-title">The last ice seller of Pasar Baru</p><p class="shrink-0 type-small text-muted-foreground">4 min left</p></div></div>`,
        },
        {
          name: 'Footnote',
          category: 'Article',
          html: `<div class="w-full"><p class="type-body">Ice first came to the city by ship,<a href="#note-1" class="text-primary no-underline"><sup class="ml-0.5 font-sans text-[0.65em]">1</sup></a> cut from New England ponds and packed in sawdust for the voyage.</p><aside id="note-1" class="mt-5 flex gap-3 border-t border-border pt-3 type-footnote text-muted-foreground"><span class="text-primary">1</span><span>The trade lasted until the first ice plants opened; the carts outlived them.</span></aside></div>`,
        },
        {
          name: 'Tag',
          category: 'Article',
          html: `<div class="flex flex-wrap gap-2"><a href="#" class="${tag}">Cities</a><a href="#" class="${tag}">Food</a><a href="#" class="${tag}">Craft</a><a href="#" class="${tag}">Letters</a></div>`,
        },
        {
          name: 'Badge',
          category: 'Status',
          html: `<div class="flex flex-wrap gap-2"><span class="${badge}"><span class="size-1.5 rounded-full bg-success"></span>Published</span><span class="${badge}"><span class="size-1.5 rounded-full bg-warning"></span>In review</span><span class="${badge}"><span class="size-1.5 rounded-full bg-destructive"></span>Overdue</span></div>`,
        },
        {
          name: 'Progress',
          category: 'Status',
          html: `<div class="w-full"><div class="flex items-baseline justify-between gap-4 type-small"><span>Issue 48</span><span class="text-muted-foreground">3 of 4 essays edited</span></div><div role="progressbar" aria-label="Issue 48" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" class="mt-2 h-0.5 w-full bg-border"><div class="h-full w-3/4 bg-primary"></div></div></div>`,
        },
        {
          name: 'List',
          category: 'Layout',
          html: `<ul class="w-full divide-y divide-border border-y border-border"><li class="${row}"><div><p class="type-title">What a kiln remembers</p><p class="mt-0.5 type-small text-muted-foreground">Ilse Brandt · 14 min</p></div><span class="text-muted-foreground">${icons.chevron}</span></li><li class="${row}"><div><p class="type-title">A grammar of alleyways</p><p class="mt-0.5 type-small text-muted-foreground">Tomás Herrera · 11 min</p></div><span class="text-muted-foreground">${icons.chevron}</span></li><li class="${row}"><div><p class="type-title">Salt and the long ferment</p><p class="mt-0.5 type-small text-muted-foreground">Raka Wiratama · 7 min</p></div><span class="text-muted-foreground">${icons.chevron}</span></li></ul>`,
        },
        {
          name: 'Card',
          category: 'Layout',
          html: `<article class="w-full rounded-lg border border-border bg-card p-6"><p class="type-overline text-muted-foreground">Craft</p><h3 class="mt-3 type-h3">What a kiln remembers</h3><p class="mt-2 type-footnote text-muted-foreground">Three days of firing and a year of waiting, in a workshop that still keeps its ash.</p><p class="mt-5 type-small text-muted-foreground">Ilse Brandt · 5 October 2026 · 14 min</p></article>`,
        },
        {
          name: 'Icon button',
          category: 'Input',
          html: `<div class="flex gap-1"><button type="button" aria-label="Save for later" class="${iconButton}">${icons.bookmark}</button><button type="button" aria-label="Share" class="${iconButton}">${icons.share}</button><button type="button" aria-label="More" class="${iconButton}">${icons.more}</button></div>`,
        },
        {
          name: 'Spinner',
          category: 'Status',
          html: `<p role="status" class="flex items-center gap-3 type-small text-muted-foreground"><span aria-hidden="true" class="size-5 animate-spin rounded-full border-[1.5px] border-border border-t-primary"></span>Loading the archive…</p>`,
        },
      ];

      const compactIconButton =
        'inline-flex size-8 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground';
      const filter =
        'h-11 shrink-0 border-b-2 border-transparent type-ui text-muted-foreground transition-colors hover:text-foreground aria-pressed:border-primary aria-pressed:text-foreground';

      const gallery = document.getElementById('gallery');
      const filters = document.getElementById('filters');
      const theme = document.getElementById('theme');
      const pad = (n) => String(n + 1).padStart(2, '0');
      const syncSliders = (root) =>
        root.querySelectorAll('input[type=range]').forEach((el) => {
          el.style.setProperty('--slider-fill', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
          const output = el.parentElement.querySelector('[data-output]');
          if (output) output.textContent = `${el.value} px`;
        });
      const paintTheme = () => (theme.innerHTML = document.documentElement.classList.contains('dark') ? icons.sun : icons.moon);

      paintTheme();
      filters.innerHTML = ['All', 'Article', 'Input', 'Navigation', 'Status', 'Layout']
        .map((name, i) => `<button type="button" aria-pressed="${i === 0}" class="${filter}">${name}</button>`)
        .join('');
      gallery.innerHTML = components
        .map(
          (c, i) => `<article data-index="${i}" data-category="${c.category}" class="flex min-h-[20rem] flex-col border-r border-b border-border p-7">
            <header class="flex items-center justify-between gap-4">
              <h2 class="type-overline"><span class="mr-3 text-muted-foreground">${pad(i)}</span>${c.name}</h2>
              <div class="-mr-2 flex">
                ${c.stateful ? `<button type="button" data-reset aria-label="Reset ${c.name}" class="${compactIconButton}">${icons.reset}</button>` : ''}
                <button type="button" data-copy aria-label="Copy ${c.name} markup" class="${compactIconButton}">${icons.copy}</button>
              </div>
            </header>
            <div data-demo class="flex flex-1 items-center py-7">${c.html}</div>
          </article>`,
        )
        .join('');
      syncSliders(gallery);

      theme.addEventListener('click', () => document.documentElement.classList.toggle('dark'));
      new MutationObserver(paintTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      filters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        for (const b of filters.children) b.setAttribute('aria-pressed', b === button);
        for (const card of gallery.children) {
          card.hidden = button.textContent !== 'All' && card.dataset.category !== button.textContent;
        }
      });

      gallery.addEventListener('input', (event) => syncSliders(event.target.parentElement));

      const selectTab = (tab) => {
        for (const t of tab.parentElement.children) {
          t.setAttribute('aria-selected', t === tab);
          t.tabIndex = t === tab ? 0 : -1;
        }
      };

      gallery.addEventListener('keydown', (event) => {
        const tab = event.target.closest('[role=tab]');
        if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        const tabs = [...tab.parentElement.children];
        const index = tabs.indexOf(tab);
        const next =
          event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
        event.preventDefault();
        selectTab(tabs[next]);
        tabs[next].focus();
      });

      gallery.addEventListener('submit', (event) => {
        const form = event.target.closest('[data-subscribe]');
        if (!form) return;
        event.preventDefault();
        form.innerHTML = `<p class="type-title">Thank you. The first letter arrives on Sunday.</p><p class="mt-3 type-small text-muted-foreground">Check your inbox for a confirmation.</p>`;
      });

      gallery.addEventListener('click', async (event) => {
        const card = event.target.closest('article[data-index]');
        if (!card) return;
        const component = components[card.dataset.index];
        const toggle = event.target.closest('[role=switch]');
        const tab = event.target.closest('[role=tab]');
        const pressed = event.target.closest('[aria-pressed]');
        const copy = event.target.closest('[data-copy]');
        if (event.target.closest('a[href="#"], a[href^="#note"]')) event.preventDefault();
        if (toggle) toggle.setAttribute('aria-checked', toggle.getAttribute('aria-checked') !== 'true');
        if (tab) selectTab(tab);
        if (pressed) pressed.setAttribute('aria-pressed', pressed.getAttribute('aria-pressed') !== 'true');
        if (event.target.closest('[data-reset]')) {
          const demo = card.querySelector('[data-demo]');
          demo.innerHTML = component.html;
          syncSliders(demo);
        }
        if (copy) {
          await navigator.clipboard.writeText(component.html);
          copy.innerHTML = icons.check;
          setTimeout(() => (copy.innerHTML = icons.copy), 1200);
        }
      });
    </script>
  </body>
</html>
