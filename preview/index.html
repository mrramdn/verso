<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verso</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="border-b border-border">
      <div class="mx-auto max-w-[1264px] px-6 sm:px-8">
        <div class="flex items-end justify-between gap-6 pt-7 pb-5">
          <p class="flex items-baseline gap-3">
            <span class="font-serif text-[2.5rem] leading-none tracking-[-0.02em]">Verso</span>
            <span class="type-overline text-muted-foreground">Beta</span>
          </p>
          <div class="flex items-center gap-6">
            <p class="hidden type-small text-muted-foreground md:block">A design system for reading. Set in Newsreader and Instrument Sans.</p>
            <button
              id="theme"
              type="button"
              aria-label="Switch between light and dark"
              class="inline-flex size-10 shrink-0 items-center justify-center rounded-sm border border-border text-foreground transition-colors hover:bg-accent"
            ></button>
          </div>
        </div>
        <hr class="verso-rule" />
        <div id="filters" class="-mb-px flex gap-6 overflow-x-auto" role="group" aria-label="Filter components"></div>
      </div>
    </header>

    <div id="sheet" class="mx-auto max-w-[1264px] px-6 pt-10 pb-6 sm:px-8">
      <main id="gallery" class="grid grid-cols-1 border-t border-l border-border sm:grid-cols-2 lg:grid-cols-3"></main>
    </div>

    <footer class="mx-auto flex max-w-[1264px] items-baseline justify-between gap-8 px-6 pb-10 sm:px-8">
      <p class="max-w-prose type-small text-muted-foreground">Every panel shows a component with its variants and states, in neutral text. <a href="demo.html" class="text-primary underline decoration-1 underline-offset-4">An article page</a> shows them in use.</p>
      <p class="shrink-0 type-small text-muted-foreground">Verso 0.2.0</p>
    </footer>

    <script>
      const icon = (paths, size = 16) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      const icons = {
        copy: icon('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
        reset: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
        check: icon('<path d="M20 6 9 17l-5-5"/>'),
        moon: icon('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>', 18),
        sun: icon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>', 18),
        chevron: icon('<path d="m9 18 6-6-6-6"/>'),
        bookmark: icon('<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>', 20),
        share: icon('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>', 20),
        more: icon('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>', 20),
      };
      icons.bookmarkSmall = icons.bookmark.replace(/(width|height)="20"/g, '$1="16"');
      icons.shareSmall = icons.share.replace(/(width|height)="20"/g, '$1="16"');
      icons.moreSmall = icons.more.replace(/(width|height)="20"/g, '$1="16"');

      const button =
        'inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-sm px-5 type-ui transition-colors disabled:pointer-events-none disabled:opacity-40';
      const buttonSmall =
        'inline-flex h-8 shrink-0 items-center justify-center gap-2 rounded-sm px-3.5 type-ui transition-colors disabled:pointer-events-none disabled:opacity-40';
      const primaryColors = 'bg-primary text-primary-foreground hover:bg-primary-hover';
      const secondaryColors = 'border border-input text-foreground hover:bg-accent';
      const ghostColors = 'text-foreground hover:bg-accent';
      const destructiveColors = 'border border-destructive text-destructive hover:bg-destructive hover:text-destructive-foreground';
      const primary = `${button} ${primaryColors}`;
      const secondary = `${button} ${secondaryColors}`;
      const ghost = `${button} ${ghostColors}`;
      const destructive = `${button} ${destructiveColors}`;
      const iconButton =
        'inline-flex size-10 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground disabled:pointer-events-none disabled:opacity-40';
      const iconButtonSmall =
        'inline-flex size-8 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground disabled:pointer-events-none disabled:opacity-40';
      const chip =
        'inline-flex h-8 shrink-0 items-center rounded-sm border border-border px-3 type-ui text-muted-foreground transition-colors hover:border-input hover:text-foreground aria-pressed:border-primary aria-pressed:text-primary';
      const tab =
        'h-11 shrink-0 border-b-2 border-transparent type-ui text-muted-foreground transition-colors hover:text-foreground aria-selected:border-primary aria-selected:text-foreground';
      const label = 'type-ui';
      const field =
        'mt-2 h-11 w-full rounded-sm border border-input bg-card px-3.5 font-sans text-base text-foreground placeholder:text-muted-foreground disabled:opacity-40';
      const fieldError =
        'mt-2 h-11 w-full rounded-sm border border-destructive bg-card px-3.5 font-sans text-base text-foreground placeholder:text-muted-foreground';
      const hint = 'mt-2 block type-small text-muted-foreground';
      const option = 'flex items-center gap-3 type-small has-[:disabled]:text-muted-foreground';
      const setting = 'flex items-center justify-between gap-6 py-3 has-[:disabled]:text-muted-foreground';
      const badge = 'inline-flex h-6 items-center gap-2 rounded-sm bg-secondary px-2 type-caption text-secondary-foreground';
      const tag =
        'inline-flex h-6 items-center rounded-sm border border-border px-2 type-overline text-muted-foreground transition-colors hover:border-input hover:text-foreground';
      const row = 'flex items-center justify-between gap-4 py-3.5';
      const toc = 'flex items-baseline gap-2 py-2.5 type-body transition-colors hover:text-primary';
      const leader = '<span aria-hidden="true" class="flex-1 border-b border-dotted border-input"></span>';
      const tocEntry = (title, page) =>
        `<li><a href="#" class="${toc}"><span>${title}</span>${leader}<span class="type-small text-muted-foreground">${page}</span></a></li>`;
      const listRow = (title) =>
        `<li class="${row}"><div><p class="type-title">${title}</p><p class="mt-0.5 type-small text-muted-foreground">Supporting text</p></div><span class="text-muted-foreground">${icons.chevron}</span></li>`;

      const components = [
        {
          name: 'Article header',
          category: 'Article',
          html: `<header class="w-full"><p class="type-overline text-primary">Kicker</p><h1 class="mt-3 type-h1">Headline set in the display style</h1><p class="mt-4 type-standfirst text-muted-foreground">A dek explains the story in one or two sentences.</p><p class="mt-6 border-t border-border pt-4 type-small text-muted-foreground">By <span class="text-foreground">Author name</span> · 14 Oct 2026 · <span class="whitespace-nowrap">6 min read</span></p></header>`,
        },
        {
          name: 'Drop cap',
          category: 'Article',
          html: `<p class="w-full type-body verso-dropcap">A drop cap opens the first paragraph of a piece. Its first letter is set three lines deep in the red ink, and the rest of the paragraph runs around it in the body style.</p>`,
        },
        {
          name: 'Button',
          category: 'Input',
          html: `<div class="flex flex-wrap gap-3"><button type="button" class="${primary}">Save</button><button type="button" class="${secondary}">Continue</button><button type="button" class="${ghost}">Cancel</button><button type="button" class="${destructive}">Delete</button></div>`,
        },
        {
          name: 'Pull quote',
          category: 'Article',
          html: `<figure class="w-full border-y border-border py-6"><blockquote class="font-serif text-[1.75rem]/9 font-light italic">“A pull quote repeats one line from the text, set large.”</blockquote><figcaption class="mt-4 type-small text-muted-foreground">Source or author</figcaption></figure>`,
        },
        {
          name: 'Toggle',
          category: 'Input',
          stateful: true,
          html: `<div class="w-full divide-y divide-border"><label class="${setting}"><span class="type-body">Notifications</span><button type="button" role="switch" aria-checked="true" class="verso-switch"></button></label><label class="${setting}"><span class="type-body">Email updates</span><button type="button" role="switch" aria-checked="false" class="verso-switch"></button></label><label class="${setting}"><span class="type-body">Autoplay</span><button type="button" role="switch" aria-checked="false" disabled class="verso-switch"></button></label></div>`,
        },
        {
          name: 'Button sizes',
          category: 'Input',
          html: `<div class="flex flex-col items-start gap-4"><div class="flex flex-wrap items-center gap-3"><button type="button" class="${primary}">Save</button><button type="button" class="${buttonSmall} ${primaryColors}">Save</button></div><div class="flex flex-wrap items-center gap-3"><button type="button" class="${secondary}">Continue</button><button type="button" class="${buttonSmall} ${secondaryColors}">Continue</button></div><div class="flex flex-wrap items-center gap-3"><button type="button" disabled class="${primary}">Save</button><button type="button" disabled class="${secondary}">Continue</button></div></div>`,
        },
        {
          name: 'Icon button',
          category: 'Input',
          html: `<div class="flex flex-col items-start gap-3"><div class="flex gap-1"><button type="button" aria-label="Save" class="${iconButton}">${icons.bookmark}</button><button type="button" aria-label="Share" class="${iconButton}">${icons.share}</button><button type="button" aria-label="More" class="${iconButton}">${icons.more}</button></div><div class="flex gap-1"><button type="button" aria-label="Save" class="${iconButtonSmall}">${icons.bookmarkSmall}</button><button type="button" aria-label="Share" class="${iconButtonSmall}">${icons.shareSmall}</button><button type="button" aria-label="More" disabled class="${iconButtonSmall}">${icons.moreSmall}</button></div></div>`,
        },
        {
          name: 'Text field',
          category: 'Input',
          stateful: true,
          html: `<label class="block w-full"><span class="${label}">Email</span><input type="email" placeholder="name@example.com" class="${field}" /><span class="${hint}">Supporting text that explains the field.</span></label>`,
        },
        {
          name: 'Text field states',
          category: 'Input',
          stateful: true,
          html: `<div class="w-full space-y-5"><label class="block"><span class="${label}">Email</span><input type="email" value="name@example" aria-invalid="true" aria-describedby="email-error" class="${fieldError}" /><span id="email-error" class="mt-2 block type-small text-destructive">Enter an email address such as name@example.com.</span></label><label class="block"><span class="${label}">Search</span><input type="search" placeholder="Search" disabled class="${field}" /><span class="${hint}">Supporting text that explains the field.</span></label></div>`,
        },
        {
          name: 'Subscribe form',
          category: 'Input',
          stateful: true,
          html: `<form class="w-full" data-subscribe><p class="type-title">Subscribe by email</p><div class="mt-4 flex gap-2"><input type="email" required aria-label="Email" placeholder="name@example.com" class="h-11 min-w-0 flex-1 rounded-sm border border-input bg-card px-3.5 font-sans text-base text-foreground placeholder:text-muted-foreground" /><button type="submit" class="${primary}">Subscribe</button></div><p class="mt-3 type-small text-muted-foreground">Supporting text says how often mail is sent.</p></form>`,
        },
        {
          name: 'Chip',
          category: 'Input',
          stateful: true,
          html: `<div role="group" aria-label="Options" class="flex flex-wrap gap-2"><button type="button" aria-pressed="true" class="${chip}">Option A</button><button type="button" aria-pressed="false" class="${chip}">Option B</button><button type="button" aria-pressed="false" class="${chip}">Option C</button></div>`,
        },
        {
          name: 'Tabs',
          category: 'Navigation',
          stateful: true,
          html: `<div role="tablist" aria-label="Period" class="flex w-full gap-6 border-b border-border"><button type="button" role="tab" aria-selected="true" class="-mb-px ${tab}">Day</button><button type="button" role="tab" aria-selected="false" tabindex="-1" class="-mb-px ${tab}">Week</button><button type="button" role="tab" aria-selected="false" tabindex="-1" class="-mb-px ${tab}">Month</button></div>`,
        },
        {
          name: 'Slider',
          category: 'Input',
          stateful: true,
          html: `<div class="w-full space-y-5"><div><div class="flex items-baseline justify-between gap-4"><span class="type-ui">Text size</span><output data-output class="type-small text-muted-foreground tabular-nums">19 px</output></div><input type="range" min="16" max="24" value="19" aria-label="Text size" class="mt-2 verso-slider" /></div><div class="text-muted-foreground"><div class="flex items-baseline justify-between gap-4"><span class="type-ui">Line height</span><output data-output class="type-small tabular-nums">30 px</output></div><input type="range" min="24" max="36" value="30" disabled aria-label="Line height" class="mt-2 verso-slider" /></div></div>`,
        },
        {
          name: 'Single selection',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Label</legend><div class="mt-3 space-y-3"><label class="${option}"><input type="radio" name="option" value="a" checked class="verso-radio" />Option A</label><label class="${option}"><input type="radio" name="option" value="b" class="verso-radio" />Option B</label><label class="${option}"><input type="radio" name="option" value="c" disabled class="verso-radio" />Option C</label></div></fieldset>`,
        },
        {
          name: 'Checkbox',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Label</legend><div class="mt-3 space-y-3"><label class="${option}"><input type="checkbox" checked class="verso-checkbox" />Option A</label><label class="${option}"><input type="checkbox" class="verso-checkbox" />Option B</label><label class="${option}"><input type="checkbox" disabled class="verso-checkbox" />Option C</label></div></fieldset>`,
        },
        {
          name: 'Table of contents',
          category: 'Navigation',
          html: `<nav aria-label="Contents" class="w-full"><p class="type-overline text-muted-foreground">Contents</p><ol class="mt-3 divide-y divide-border border-y border-border">${tocEntry('Section one', 1)}${tocEntry('Section two', 4)}${tocEntry('Section three', 9)}</ol></nav>`,
        },
        {
          name: 'Reading progress',
          category: 'Navigation',
          html: `<div class="w-full border-b border-border"><div role="progressbar" aria-label="Reading progress" aria-valuenow="56" aria-valuemin="0" aria-valuemax="100" class="h-0.5 w-full bg-border"><div class="h-full w-[56%] bg-primary"></div></div><div class="flex h-11 items-center justify-between gap-4"><p class="truncate type-title">Article title</p><p class="shrink-0 type-small text-muted-foreground">4 min left</p></div></div>`,
        },
        {
          name: 'Footnote',
          category: 'Article',
          html: `<div class="w-full"><p class="type-body">A footnote mark follows the word it explains,<a href="#note-1" class="text-primary no-underline"><sup class="ml-0.5 font-sans text-[0.65em]">1</sup></a> and the note sits below the text.</p><aside id="note-1" class="mt-5 flex gap-3 border-t border-border pt-3 type-footnote text-muted-foreground"><span class="text-primary">1</span><span>The note repeats the number and is set in the footnote style.</span></aside></div>`,
        },
        {
          name: 'Tag',
          category: 'Article',
          html: `<div class="flex flex-wrap gap-2"><a href="#" class="${tag}">Topic A</a><a href="#" class="${tag}">Topic B</a><a href="#" class="${tag}">Topic C</a></div>`,
        },
        {
          name: 'Badge',
          category: 'Status',
          html: `<div class="flex flex-wrap gap-2"><span class="${badge}"><span class="size-1.5 rounded-full bg-success"></span>Active</span><span class="${badge}"><span class="size-1.5 rounded-full bg-warning"></span>Pending</span><span class="${badge}"><span class="size-1.5 rounded-full bg-destructive"></span>Failed</span><span class="${badge}"><span class="size-1.5 rounded-full bg-muted-foreground"></span>Draft</span></div>`,
        },
        {
          name: 'Progress',
          category: 'Status',
          html: `<div class="w-full"><div class="flex items-baseline justify-between gap-4 type-small"><span>Label</span><span class="text-muted-foreground">3 of 4</span></div><div role="progressbar" aria-label="Label" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" class="mt-2 h-0.5 w-full bg-border"><div class="h-full w-3/4 bg-primary"></div></div></div>`,
        },
        {
          name: 'List',
          category: 'Layout',
          html: `<ul class="w-full divide-y divide-border border-y border-border">${listRow('Account')}${listRow('Notifications')}${listRow('Privacy')}</ul>`,
        },
        {
          name: 'Card',
          category: 'Layout',
          html: `<article class="w-full rounded-lg border border-border bg-card p-6"><p class="type-overline text-muted-foreground">Overline</p><h3 class="mt-3 type-h3">Card title</h3><p class="mt-2 type-footnote text-muted-foreground">Supporting text that explains the item in a line or two.</p><p class="mt-5 type-small text-muted-foreground">Author name · 14 Oct 2026 · 6 min</p></article>`,
        },
        {
          name: 'Spinner',
          category: 'Status',
          html: `<p role="status" class="flex items-center gap-3 type-small text-muted-foreground"><span aria-hidden="true" class="size-5 animate-spin rounded-full border-[1.5px] border-border border-t-primary"></span>Loading…</p>`,
        },
      ];

      const compactIconButton =
        'inline-flex size-8 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground';
      const filter =
        'h-11 shrink-0 border-b-2 border-transparent type-ui text-muted-foreground transition-colors hover:text-foreground aria-pressed:border-primary aria-pressed:text-foreground';

      const gallery = document.getElementById('gallery');
      const filters = document.getElementById('filters');
      const theme = document.getElementById('theme');
      const pad = (n) => String(n + 1).padStart(2, '0');
      const syncSliders = (root) =>
        root.querySelectorAll('input[type=range]').forEach((el) => {
          el.style.setProperty('--slider-fill', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
          const output = el.parentElement.querySelector('[data-output]');
          if (output) output.textContent = `${el.value} px`;
        });
      const paintTheme = () => (theme.innerHTML = document.documentElement.classList.contains('dark') ? icons.sun : icons.moon);

      paintTheme();
      filters.innerHTML = ['All', 'Article', 'Input', 'Navigation', 'Status', 'Layout']
        .map((name, i) => `<button type="button" aria-pressed="${i === 0}" class="${filter}">${name}</button>`)
        .join('');
      gallery.innerHTML = components
        .map(
          (c, i) => `<article data-index="${i}" data-category="${c.category}" class="flex min-h-[20rem] flex-col border-r border-b border-border p-7">
            <header class="flex items-center justify-between gap-4">
              <h2 class="type-overline"><span class="mr-3 text-muted-foreground">${pad(i)}</span>${c.name}</h2>
              <div class="-mr-2 flex">
                ${c.stateful ? `<button type="button" data-reset aria-label="Reset ${c.name}" class="${compactIconButton}">${icons.reset}</button>` : ''}
                <button type="button" data-copy aria-label="Copy ${c.name} markup" class="${compactIconButton}">${icons.copy}</button>
              </div>
            </header>
            <div data-demo class="flex flex-1 items-center py-7">${c.html}</div>
          </article>`,
        )
        .join('');
      syncSliders(gallery);

      theme.addEventListener('click', () => document.documentElement.classList.toggle('dark'));
      new MutationObserver(paintTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      filters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        for (const b of filters.children) b.setAttribute('aria-pressed', b === button);
        for (const card of gallery.children) {
          card.hidden = button.textContent !== 'All' && card.dataset.category !== button.textContent;
        }
      });

      gallery.addEventListener('input', (event) => syncSliders(event.target.parentElement));

      const selectTab = (tab) => {
        for (const t of tab.parentElement.children) {
          t.setAttribute('aria-selected', t === tab);
          t.tabIndex = t === tab ? 0 : -1;
        }
      };

      gallery.addEventListener('keydown', (event) => {
        const tab = event.target.closest('[role=tab]');
        if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        const tabs = [...tab.parentElement.children];
        const index = tabs.indexOf(tab);
        const next =
          event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
        event.preventDefault();
        selectTab(tabs[next]);
        tabs[next].focus();
      });

      gallery.addEventListener('submit', (event) => {
        const form = event.target.closest('[data-subscribe]');
        if (!form) return;
        event.preventDefault();
        form.innerHTML = `<p class="type-title">Thank you for subscribing.</p><p class="mt-3 type-small text-muted-foreground">Check your inbox to confirm the address.</p>`;
      });

      gallery.addEventListener('click', async (event) => {
        const card = event.target.closest('article[data-index]');
        if (!card) return;
        const component = components[card.dataset.index];
        const toggle = event.target.closest('[role=switch]');
        const tab = event.target.closest('[role=tab]');
        const pressed = event.target.closest('[aria-pressed]');
        const copy = event.target.closest('[data-copy]');
        if (event.target.closest('a[href="#"], a[href^="#note"]')) event.preventDefault();
        if (toggle) toggle.setAttribute('aria-checked', toggle.getAttribute('aria-checked') !== 'true');
        if (tab) selectTab(tab);
        if (pressed) pressed.setAttribute('aria-pressed', pressed.getAttribute('aria-pressed') !== 'true');
        if (event.target.closest('[data-reset]')) {
          const demo = card.querySelector('[data-demo]');
          demo.innerHTML = component.html;
          syncSliders(demo);
        }
        if (copy) {
          await navigator.clipboard.writeText(component.html);
          copy.innerHTML = icons.check;
          setTimeout(() => (copy.innerHTML = icons.copy), 1200);
        }
      });
    </script>
  </body>
</html>
